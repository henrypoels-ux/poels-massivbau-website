name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Web3Forms key
        env:
          # Settings → Secrets and variables → Actions (als Variable oder Secret)
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY || secrets.PUBLIC_WEB3FORMS_KEY }}
        run: |
          if [ -z "$PUBLIC_WEB3FORMS_KEY" ]; then
            echo "::error::PUBLIC_WEB3FORMS_KEY fehlt – Kontaktformular würde nicht funktionieren. Unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY || secrets.PUBLIC_WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
